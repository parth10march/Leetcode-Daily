name: Update README

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths-ignore:
      # Skip when this workflow itself made the commit (the files it changes)
      - "README.md"
      - "topics.json"
  workflow_dispatch:       # Allow manual runs from the Actions tab
  schedule:
    # 00:30 IST = 19:00 UTC previous day
    - cron: "30 18 * * *"

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      # Full history so git-log dates are accurate
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 1: refresh topics.json from LeetHub's README section
      - name: Sync topic cache
        run: python scripts/sync_topics.py

      # Step 2: regenerate root README.md
      - name: Generate README
        run: python scripts/generate_readme.py

      # Step 3: commit only when something actually changed
      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md topics.json
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "docs: auto-update README [skip ci]"
            git push
          fi